name: release
on:
  push:
    tags: ["v*"]
  # checks-release-tag pushes the tag with the workflow token, which starts no push run, so it dispatches this workflow on the tag.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github-release:
    permissions:
      contents: write
      id-token: write
    uses: avi2d/workflows/.github/workflows/release.yml@v2
    with:
      build-command: bun run build
      clean-tree-command: git diff --exit-code
      github-release: true
