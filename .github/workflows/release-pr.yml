name: release-pr
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-pr:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: avi2d/workflows/.github/workflows/release-pr.yml@v2
    with:
      plan-command: ./node_modules/.bin/checks-release-pr ci.yml
      tag-command: ./node_modules/.bin/checks-release-tag release.yml
