name: advisories

on:
  schedule:
    - cron: "21 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: avi2d/workflows/setup@v1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: bunx checks-advisories --all
