name: night-run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-run
  cancel-in-progress: false

jobs:
  mutation:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: avi2d/workflows/setup@v1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun run generate
      - run: time bunx stryker run
      - uses: actions/upload-artifact@v4
        with:
          name: night-run-mutation
          path: reports/mutation/mutation.json
          retention-days: 1

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: avi2d/workflows/setup@v1
        with:
          fetch-depth: 0
      # A failing gate becomes an issue, so its exit leaves the job going on to the upload.
      - run: mkdir -p reports/night-run-gates && bunx checks-lint --night > reports/night-run-gates/gates.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: night-run-gates
          path: reports/night-run-gates/
          retention-days: 1

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: avi2d/workflows/setup@v1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm install -g @anthropic-ai/claude-code@2.1.280
      - run: scripts/ci-sqlite3.sh
      - run: scripts/ci-no-mistakes.sh
      - continue-on-error: true
        run: bunx checks-test --tier=unit --junit=reports/night-run-tests/unit.xml
      - continue-on-error: true
        run: bunx checks-test --tier=e2e --junit=reports/night-run-tests/e2e.xml
      - uses: actions/upload-artifact@v4
        with:
          name: night-run-tests
          path: reports/night-run-tests/
          retention-days: 1

  report:
    needs: [mutation, gates, tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: avi2d/workflows/setup@v1
      - if: needs.mutation.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: night-run-mutation
          path: reports/mutation
      - if: needs.tests.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: night-run-tests
          path: reports/night-run-tests
      - if: needs.gates.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: night-run-gates
          path: reports/night-run-gates
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bunx checks-night-run --mutation reports/mutation/mutation.json ${{ needs.tests.result == 'success' && '--tests reports/night-run-tests/unit.xml --tests reports/night-run-tests/e2e.xml' || '' }} ${{ needs.gates.result == 'success' && '--gates reports/night-run-gates/gates.log' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: night-run
          path: reports/night-run.json
          if-no-files-found: ignore
          retention-days: 90
